storage:
  provider: local  # local | s3 | azure_blob | gdrive
  local:
    path: ./storage-exports
  s3:
    bucket: null
    prefix: synthea/
  azure_blob:
    account_url: null  # e.g. https://ACCOUNT.blob.core.windows.net
    container: null
    prefix: synthea/
  gdrive:
    folder_id: null
# Authentication comes from standard SDK credential chains. Never store secrets here.
